# 莱赛尔本机入口：localhost:80 -> Spring Boot 127.0.0.1:8080。
# 使用本项目独立的日志和 PID，可与现有 90 端口 Nginx 同时运行。
worker_processes 1;
pid .local/nginx/nginx.pid;
error_log .local/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log .local/nginx/access.log;
    server_tokens off;
    client_max_body_size 6m;
    client_body_temp_path .local/nginx/client_temp;
    proxy_temp_path .local/nginx/proxy_temp;
    fastcgi_temp_path .local/nginx/fastcgi_temp;
    uwsgi_temp_path .local/nginx/uwsgi_temp;
    scgi_temp_path .local/nginx/scgi_temp;

    server {
        # 只接受本机 IPv4 和 IPv6 连接。
        listen 127.0.0.1:80;
        listen [::1]:80;
        server_name localhost 127.0.0.1;

        location / {
            # 保留完整路径：/api/orders 仍转发到 /api/orders。
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
